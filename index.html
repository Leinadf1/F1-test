<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitmovin Player Nativo</title>

  <!-- Bitmovin Player JS & CSS UI -->
  <script type="text/javascript" src="https://cdn.bitmovin.com/player/web/8/bitmovinplayer.js"></script>
  <link rel="stylesheet" href="https://cdn.bitmovin.com/player/web/8/bitmovinplayer-ui.css">
  <script type="text/javascript" src="https://cdn.bitmovin.com/player/web/8/bitmovinplayer-ui.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.9em; }
    input[type="text"] {
      width: 100%; padding: 10px; background: #1e1e1e; border: 1px solid #333;
      border-radius: 4px; color: #fff; font-family: monospace;
    }
    button {
      width: 100%; padding: 12px; background-color: #00d26a; border: none;
      border-radius: 4px; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px;
    }
    #player-container {
      width: 100%; aspect-ratio: 16 / 9; background: #000; margin-top: 20px;
      border-radius: 8px; overflow: hidden; border: 1px solid #333;
    }
    #error-log { color: #ff5555; margin-top: 10px; font-family: monospace; font-size: 0.85em; }
  </style>
</head>
<body>

<div class="container">
  <h2>Bitmovin Player (UI Nativa)</h2>
  
  <div class="form-group">
    <label for="mpdUrl">URL Flusso (.mpd):</label>
    <input type="text" id="mpdUrl" placeholder="https://example.com/live/stream.mpd">
  </div>

  <div class="form-group">
    <label for="keyPair">Key (Formato KID:KEY):</label>
    <input type="text" id="keyPair" placeholder="eb670a80d1414e6992d20e1ee9217636:100b6c20940f779a458912382ee84273">
  </div>

  <button onclick="loadStream()">AVVIA PLAYER</button>
  <div id="error-log"></div>

  <div id="player-container"></div>
</div>

<script>
  let player = null;

  function logError(msg) {
    document.getElementById('error-log').innerText = msg;
  }

  function loadStream() {
    logError("");
    const streamUrl = document.getElementById('mpdUrl').value.trim();
    const keyPair = document.getElementById('keyPair').value.trim();

    if (!streamUrl) {
      logError("Inserisci un URL valido per il flusso .mpd");
      return;
    }

    if (player) {
      player.destroy();
      document.getElementById('player-container').innerHTML = '';
    }

    const container = document.getElementById('player-container');
    
    // Configurazione Bitmovin
    const config = {
      key: "", // Lascia vuoto per il player demo / localhost
      playback: {
        autoplay: true,
        muted: true
      },
      style: {
        aspectratio: '16:9'
      }
    };

    player = new bitmovin.player.Player(container, config);

    // Gestione DRM ClearKey
    const source = {
      dash: streamUrl
    };

    if (keyPair.includes(':')) {
      const parts = keyPair.split(':');
      source.drm = {
        clearkey: [{
          keyId: parts[0].trim().replace(/-/g, ''),
          key: parts[1].trim().replace(/-/g, ''),
        }]
      };
    }

    player.load(source).then(() => {
      // Collega l'interfaccia UI di Bitmovin
      bitmovin.playerui.UIFactory.buildDefaultUI(player);
    }).catch((error) => {
      logError("Errore Bitmovin: " + error.message);
    });
  }
</script>

</body>
</html>
