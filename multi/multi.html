<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shaka Multiviewer - F1</title>

  <!-- Shaka Player Engine & UI CSS/JS -->
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/shaka-player.ui.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/controls.css">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: #0d0d0d;
      color: #fff;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      display: flex;
      gap: 10px;
      padding: 10px;
      background: #1e1e1e;
      align-items: center;
    }
    .top-bar button {
      padding: 8px 16px;
      background: #00d26a;
      border: none;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 8px;
      flex: 1;
    }
    .grid-1 { grid-template-columns: 1fr; }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-4 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }

    .screen-card {
      background: #000;
      border: 1px solid #222;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .screen-header {
      padding: 6px;
      background: #181818;
    }
    select {
      width: 100%;
      padding: 6px;
      background: #252525;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
    }
    .video-wrapper {
      flex: 1;
      position: relative;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <strong>LAYOUT:</strong>
    <button onclick="setLayout(1)">1 Schermo</button>
    <button onclick="setLayout(2)">2 Schermi</button>
    <button onclick="setLayout(4)">4 Schermi</button>
  </div>

  <div class="grid-container grid-4" id="grid">
    <!-- Generazione dei 4 schermi -->
    <script>
      for (let i = 1; i <= 4; i++) {
        document.write(`
          <div class="screen-card">
            <div class="screen-header">
              <select id="select-screen-${i}" onchange="changeStream(${i}, this.value)">
                <option value="">-- Seleziona Stream --</option>
              </select>
            </div>
            <div class="video-wrapper" data-shaka-player-container>
              <video id="video-${i}" data-shaka-player autoplay muted></video>
            </div>
          </div>
        `);
      }
    </script>
  </div>

  <script>
    const M3U_URL = "https://gist.github.com/Leinadf1/4246b01b8870f49e2cfa50fda49a767e/raw/F1_CAM_APPLE_TV.m3u";
    const streams = [];
    const playerInstances = {};

    // 1. Parsing del file .M3U
    async function loadM3U() {
      try {
        const response = await fetch(M3U_URL);
        const text = await response.text();
        const lines = text.split('\n');

        let currentName = "";
        let currentKID = "";
        let currentKey = "";

        for (let line of lines) {
          line = line.trim();
          if (line.startsWith('#EXTINF:')) {
            const parts = line.split(',');
            currentName = parts[1] ? parts[1].trim() : "Canale Senza Nome";
          } else if (line.startsWith('#EXTVLCOPT:option=clearkey=')) {
            const keys = line.split('=')[2];
            if (keys && keys.includes(':')) {
              const pair = keys.split(':');
              currentKID = pair[0].trim();
              currentKey = pair[1].trim();
            }
          } else if (line.startsWith('http')) {
            streams.push({
              name: currentName,
              url: line,
              kid: currentKID,
              key: currentKey
            });
            currentName = ""; currentKID = ""; currentKey = "";
          }
        }
        populateDropdowns();
      } catch (err) {
        console.error("Errore nel caricamento della playlist:", err);
      }
    }

    // 2. Popola i select dei vari schermi
    function populateDropdowns() {
      for (let i = 1; i <= 4; i++) {
        const select = document.getElementById(`select-screen-${i}`);
        streams.forEach((stream, index) => {
          const opt = document.createElement('option');
          opt.value = index;
          opt.innerText = stream.name;
          select.appendChild(opt);
        });
      }
    }

    // 3. Inizializzazione del Player Shaka con le impostazioni Fast-Start
    async function changeStream(screenId, streamIndex) {
      if (streamIndex === "") return;
      const item = streams[streamIndex];
      const video = document.getElementById(`video-${screenId}`);

      if (!playerInstances[screenId]) {
        playerInstances[screenId] = new shaka.Player(video);
      }

      const player = playerInstances[screenId];

      // Configurazione Bassa Latenza e Avvio Istantaneo
      const clearKeys = {};
      if (item.kid && item.key) {
        clearKeys[item.kid] = item.key;
      }

      player.configure({
        drm: { clearKeys: clearKeys },
        streaming: {
          rebufferingGoal: 0.5,
          bufferingGoal: 2,
          lowLatencyMode: true,
          jumpLargeGaps: true
        },
        manifest: {
          dash: { ignoreMinBufferTime: true }
        }
      });

      try {
        await player.load(item.url);
        video.play();
      } catch (e) {
        console.error("Errore di riproduzione:", e);
      }
    }

    // Cambia il layout a griglia
    function setLayout(count) {
      const grid = document.getElementById('grid');
      grid.className = `grid-container grid-${count}`;
    }

    // Installazione Polifyll Shaka all'avvio
    document.addEventListener('DOMContentLoaded', () => {
      shaka.polyfill.installAll();
      loadM3U();
    });
  </script>
</body>
</html>
