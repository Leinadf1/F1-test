<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clappr MPD + ClearKey DRM Player (Fixed)</title>

  <!-- Clappr Core -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
  <!-- Shaka Player Engine -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/shaka-player.compiled.js"></script>
  <!-- Clappr DASH Plugin -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/dash-shaka-playback@3.6.3/dist/dash-shaka-playback.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background-color: #121212;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; color: #aaa; }
    input[type="text"] {
      width: 100%; padding: 10px; background: #1e1e1e; border: 1px solid #333;
      border-radius: 4px; color: #fff; font-family: monospace; font-size: 0.9em;
    }
    input[type="text"]:focus { outline: none; border-color: #00d26a; }
    .row { display: flex; gap: 10px; }
    .col { flex: 1; }
    button {
      width: 100%; padding: 12px; background-color: #00d26a; border: none;
      border-radius: 4px; color: #000; font-weight: bold; cursor: pointer; font-size: 1em; margin-top: 10px;
    }
    button:hover { background-color: #00b058; }
    #player-container {
      width: 100%; aspect-ratio: 16 / 9; background: #000; margin-top: 20px;
      border-radius: 8px; overflow: hidden; border: 1px solid #333;
    }
    #error-log { color: #ff5555; margin-top: 10px; font-family: monospace; font-size: 0.85em; }
  </style>
</head>
<body>

<div class="container">
  <h2>Clappr DASH / ClearKey Player</h2>
  
  <div class="form-group">
    <label for="mpdUrl">URL Flusso (.mpd):</label>
    <input type="text" id="mpdUrl" placeholder="https://example.com/live/stream.mpd">
  </div>

  <div class="form-group">
    <label for="keyPair">Key (Formato KID:KEY):</label>
    <input type="text" id="keyPair" placeholder="eb670a80d1414e6992d20e1ee9217636:100b6c20940f779a458912382ee84273">
  </div>

  <button onclick="loadStream()">AVVIA RIPRODUZIONE</button>
  <div id="error-log"></div>

  <div id="player-container"></div>
</div>

<script>
  let playerInstance = null;

  function logError(msg) {
    document.getElementById('error-log').innerText = msg;
  }

  function loadStream() {
    logError("");
    const streamUrl = document.getElementById('mpdUrl').value.trim();
    const keyPair = document.getElementById('keyPair').value.trim();

    if (!streamUrl) {
      logError("Inserisci un URL valido per il flusso .mpd");
      return;
    }

    if (playerInstance) {
      playerInstance.destroy();
      document.getElementById('player-container').innerHTML = '';
    }

    const clearKeys = {};

    // Supporta sia formato KID:KEY sia valori singoli
    if (keyPair.includes(':')) {
      const parts = keyPair.split(':');
      const kid = parts[0].trim().replace(/-/g, '');
      const key = parts[1].trim().replace(/-/g, '');
      clearKeys[kid] = key;
    }

    playerInstance = new Clappr.Player({
      source: streamUrl,
      parentId: "#player-container",
      plugins: [DashShakaPlayback],
      shakaConfiguration: {
        drm: {
          clearKeys: clearKeys
        },
        manifest: {
          retryParameters: { maxAttempts: 2 }
        }
      },
      shakaOnRequirementFailure: function(e) {
        logError("Errore Shaka/DRM: " + JSON.stringify(e));
      },
      width: "100%",
      height: "100%",
      autoPlay: true,
      mute: true
    });
  }
</script>

</body>
</html>
